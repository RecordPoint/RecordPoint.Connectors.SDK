trigger:
- main

resources:
  repositories:
  - repository: azure-pipelines-templates
    type: git
    project: Shared Resources
    name: azure-pipelines-templates

pool:
  vmImage: 'ubuntu-latest'

variables:
  BuildConfiguration: Release
  ArtifactNuGetName: 'packages-nuget'

stages:
- template: packages/build-test-pack.yaml@azure-pipelines-templates
  parameters:
    ArtifactNuGetName: $(ArtifactNuGetName)
    BuildConfiguration: $(BuildConfiguration)
    SonarCloudProjectKey: 'RecordPoint_RecordPoint.Connectors.SDK'
    SonarCloudProjectName: 'RecordPoint.Connectors.SDK'
    dotnetSDK: '10.0.x'
    PackagesToPack: '**/*.csproj;!**/*.Test.csproj;!ReferenceConnector/**/*.csproj'
    TestProjects: |
      Tests/**/*.Test.csproj

- stage: publishinternal
  dependsOn: test_build
  condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
  displayName: 'Nuget - Publish Internal Packages'
  jobs:
  - deployment: publishinternal
    displayName: 'Nuget - Publish packages to internal feed'
    environment: RecordPoint-Connectors-SDK-Internal
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: '$(ArtifactNugetName)'
            displayName: 'Download nuget packages'

          - task: DotNetCoreCLI@2
            displayName: "Publish nuget packages to internal feed"
            inputs:
              command: 'push'
              packagesToPush: '$(Agent.BuildDirectory)/$(ArtifactNugetName)/*.nupkg'
              nuGetFeedType: 'internal'
              publishVstsFeed: '607bbd8a-5bd5-4ec1-8180-3593f0ff5a1f'

          - task: PublishSymbols@2
            displayName: 'Publish symbols'
            inputs:
              SymbolServerType: TeamServices
